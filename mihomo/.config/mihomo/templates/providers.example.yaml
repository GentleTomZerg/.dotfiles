# ============================================================================
# providers.example.yaml — subscription provider example (no secrets; safe to publish)
# ============================================================================
#
# Copy to user/providers.yaml (gitignored — the URL carries your token), replace
# <YOUR_SUBSCRIPTION_URL>, then run startproxy. One block per subscription.
# Every group in base.yaml uses include-all: true, so new nodes need no group edit.
# See README.md for how the three documents merge.
# ============================================================================

proxy-providers:
  # ---- Example: one subscription, nodes prefixed [airport-1] --------------
  airport-1:
    type: http
    url: "<YOUR_SUBSCRIPTION_URL>"
    # Relative to Home Dir; mihomo writes the cache, so a start works offline.
    path: ./proxy_providers/airport-1.yaml
    interval: 86400
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
    header:
      # Clash-family UA only: most airports return the full config to these.
      User-Agent:
        - "Clash-verge/v2.2.0"
    override:
      additional-prefix: "[airport-1]"   # node-name prefix; empty with one subscription

  # ---- Example: a second subscription (copy this block, change name / url / path) ----
  # airport-2:
  #   type: http
  #   url: "<YOUR_SUBSCRIPTION_URL_2>"
  #   path: ./proxy_providers/airport-2.yaml
  #   interval: 86400
  #   health-check:
  #     enable: true
  #     url: "https://www.gstatic.com/generate_204"
  #     interval: 300
  #   header:
  #     User-Agent:
  #       - "Clash-verge/v2.2.0"
  #   override:
  #     additional-prefix: "[airport-2]"

  # ---- Example: a local-file subscription (offline / self-maintained list) ----
  # custom:
  #   type: file
  #   path: ./proxy_providers/custom.yaml   # hand-maintained node list (Clash yaml)
  #   health-check:
  #     enable: true
  #     url: "https://www.gstatic.com/generate_204"
  #     interval: 300
