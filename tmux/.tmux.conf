# ==================== PLUGIN DECLARATIONS ====================
# Plugins loaded in order; custom configs below override plugin defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin "catppuccin/tmux"


# ==================== CUSTOM CONFIGURATIONS ====================
# These settings override plugin defaults
# general
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g status-position top
set -g allow-passthrough on

# theme
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_status_background "none"
set -g @catppuccin_status_module_bg_color "default"
set -g @catppuccin_window_status_style "basic"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# session
set -g @continuum-restore 'on'

# visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# keymaps
unbind C-b
set -g prefix C-Space
bind | split-window -h
bind \\ split-window -v

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
# capture panel content to nvim
bind-key v split-window -h "tmux capture-pane -pt! -S -100000 | nvim -"

# ==================== PLUGIN INITIALIZATION ====================
run '~/.tmux/plugins/tpm/tpm'

# ==================== PLUGIN-SPECIFIC CONFIGS ====================
# Must come after TPM initialization
# tmux 3.8 highlights the whole line in choose-tree with tree-mode-selection-style
# (default: mode-style, which catppuccin sets to a solid surface_0 block).
# Keep the selection transparent and just tint the text.
set -gF tree-mode-selection-style "fg=#{@thm_mauve},bg=default,bold"
# tmux 3.8 fills the choose-tree preview border with themedarkgrey
# (tree-mode-border-style bg=themedarkgrey). Drop the fill, keep a thin line.
set -gF tree-mode-border-style "fg=#{@thm_overlay_0}"
# tmux 3.8's default underlines the active window tab; catppuccin already colours
# it, so drop the attribute.
set -g window-status-current-style "none"
# tmux 3.7 draws the command prompt as an overlay on the status line instead
# of replacing it (tmux issue 5328). Catppuccin centres the prompt, putting it
# on top of the window tabs; `fill` would cover the bar with a solid block.
# Aligning left keeps the prompt transparent and confines it to the left edge,
# where it only grazes the front of the first window tab.
set -gF message-style "fg=#{@thm_teal},bg=default,align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=left"
