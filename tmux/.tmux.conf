# ==================== PLUGIN DECLARATIONS ====================
# Plugins loaded in order; custom configs below override plugin defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'


# ==================== GENERAL OPTIONS ====================
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set -g allow-passthrough on

# ==================== THEME ====================
# Catppuccin Macchiato, inlined (previously the catppuccin/tmux plugin).
# Palette variables keep the @thm_* names so existing references below work.
# Styles below override tmux 3.7/3.8 built-ins; last write wins, so each
# surface's base stays above its override.
set -g @thm_bg        "#24273a"
set -g @thm_fg        "#cad3f5"
set -g @thm_rosewater "#f4dbd6"
set -g @thm_flamingo  "#f0c6c6"
set -g @thm_pink      "#f5bde6"
set -g @thm_mauve     "#c6a0f6"
set -g @thm_red       "#ed8796"
set -g @thm_maroon    "#ee99a0"
set -g @thm_peach     "#f5a97f"
set -g @thm_yellow    "#eed49f"
set -g @thm_green     "#a6da95"
set -g @thm_teal      "#8bd5ca"
set -g @thm_sky       "#91d7e3"
set -g @thm_sapphire  "#7dc4e4"
set -g @thm_blue      "#8aadf4"
set -g @thm_lavender  "#b7bdf8"
set -g @thm_subtext_1 "#a5adcb"
set -g @thm_subtext_0 "#b8c0e0"
set -g @thm_overlay_2 "#939ab7"
set -g @thm_overlay_1 "#8087a2"
set -g @thm_overlay_0 "#6e738d"
set -g @thm_surface_2 "#5b6078"
set -g @thm_surface_1 "#494d64"
set -g @thm_surface_0 "#363a4f"
set -g @thm_mantle    "#1e2030"
set -g @thm_crust     "#181926"

# Nerd Font glyphs for the status bar. FiraCode Nerd Font has all of them;
# checked with `fc-list ':charset=F0293'`.
set -g @thm_status_cap   ""   # U+E0B6 left rounded cap
set -g @thm_status_cap_r ""   # U+E0B4 right rounded cap
set -g @thm_zoom_icon    "󰊓"   # U+F0293 window has a zoomed pane

# tmux 3.8's own built-in theme: the chrome tmux draws itself, and what tmux
# reports to panes. The terminal is always dark, so don't autodetect.
set -s theme dark

# Panes, modes, popups
set -gF pane-border-style "fg=#{@thm_overlay_0}"
# `##{` survives the -F pass and becomes a literal `#{` in the stored value, so the
# condition is still evaluated when the border is drawn (same as before).
set -gF pane-active-border-style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF clock-mode-colour "#{@thm_blue}"
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "fg=#{@thm_surface_1}"
set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# choose-tree (tmux 3.8): selection defaults to mode-style, a solid surface_0
# block; keep it transparent and just tint the text. The preview border defaults
# to a themedarkgrey fill; drop the fill, keep a thin line.
set -gF tree-mode-selection-style "fg=#{@thm_mauve},bg=default,bold"
set -gF tree-mode-border-style "fg=#{@thm_overlay_0}"

# ==================== STATUS BAR ====================
# Layout from vaaleyard/tmux-dotbar, inlined and re-pointed at the @thm_*
# palette: centred, index-less window list with dot separators, the
# session pill on the left, nothing on the right.
set -g status-position top
set -g status-style "bg=default,fg=#{@thm_overlay_0}"
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100
set -g status-right ""

# The separator between windows is drawn in the status-line default style, not
# window-status-style (tmux emits `#[norange default]` before it in
# status-format), so status-style above is what colours the dots.

# Session: dim " #S " at rest; a green rounded pill replaces it while the prefix
# key is held. The cap glyphs replace the surrounding padding, so the width stays
# stable when the pill appears.
# Every multi-attribute style directive has to sit OUTSIDE the conditionals: a
# bare comma inside `#[...]` is an argument separator for the enclosing `#{?...}`
# (only commas inside a nested `#{...}` are safe), so a branch may hold at most a
# single-attribute directive. That is why the pill body's style is emitted
# unconditionally, with an empty branch when the prefix is up.
set -g status-left "#[bg=default,fg=#{@thm_overlay_0}]#{?client_prefix,#[fg=#{@thm_green}]#{@thm_status_cap}, #S }#[bg=#{@thm_green},fg=#{@thm_bg},bold]#{?client_prefix,#S,}#[bg=default,fg=#{@thm_overlay_0},nobold]#{?client_prefix,#[fg=#{@thm_green}]#{@thm_status_cap_r},}"

# Window tabs: name only, no index. Dim by default, bright when current,
# with a zoom marker on the current one.
# Do NOT use -F on these two: it expands the value once when the config is
# sourced, and #W is itself a format, so it would be baked to whatever window is
# current at load time (or to nothing on a fresh server).
set -g window-status-separator " • "
set -gF window-status-style "fg=#{@thm_overlay_0},bg=default"
set -g window-status-format "#[fg=#{@thm_overlay_0},bg=default] #W "
set -g window-status-current-format "#[fg=#{@thm_fg},bg=default] #W #[fg=#{@thm_teal},bg=default]#{?window_zoomed_flag,#{@thm_zoom_icon},}"
# tmux 3.8's default underlines the active window tab; it is coloured above, so
# drop the attribute.
set -g window-status-current-style "none"
set -gF window-status-activity-style "bg=#{@thm_lavender},fg=#{@thm_crust}"
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"

# The command prompt is drawn as an overlay on the status line (tmux 3.7,
# issue 5328). Left-aligning keeps it transparent.
set -gF message-style "fg=#{@thm_teal},bg=default,align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=left"

# ==================== KEYBINDINGS ====================
# Split by key table: the copy-mode-vi table first, then the prefix table.

# copy-mode-vi table
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# prefix table
unbind C-b
set -g prefix C-Space
bind | split-window -h
bind \\ split-window -v
bind r source-file ~/.tmux.conf
# capture the pane to nvim
bind-key v split-window -h "tmux capture-pane -pt! -S -100000 | nvim -"

# ==================== PLUGIN INITIALIZATION ====================
run '~/.tmux/plugins/tpm/tpm'
