# ==================== PLUGIN DECLARATIONS ====================
# Plugins loaded in order; custom configs below override plugin defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin "catppuccin/tmux"


# ==================== CUSTOM CONFIGURATIONS ====================
# These settings override plugin defaults
# general
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g status-position top
set -g allow-passthrough on

# theme
set -g @catppuccin_flavour "macchiato"
set -g @catppuccin_status_background "default"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# session
set -g @continuum-restore 'on'

# visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# keymaps
unbind C-b
set -g prefix C-Space
bind | split-window -h
bind \\ split-window -v

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
# capture panel content to nvim
bind-key v split-window -h "tmux capture-pane -pt! -S -100000 | nvim -"

# ==================== PLUGIN INITIALIZATION ====================
run '~/.tmux/plugins/tpm/tpm'

# ==================== PLUGIN-SPECIFIC CONFIGS ====================
# Must come after TPM initialization
set -gF status-style bg=default
set -gF status-bg default
