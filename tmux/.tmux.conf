# ==================== PLUGIN DECLARATIONS ====================
# Plugins loaded in order; custom configs below override plugin defaults
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'


# ==================== CUSTOM CONFIGURATIONS ====================
# These settings override plugin defaults
# general
set -g default-terminal "tmux-256color"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -g status-position top
set -g allow-passthrough on

# ==================== THEME ====================
# Catppuccin Macchiato, inlined (previously the catppuccin/tmux plugin).
# Palette variables keep the @thm_* names so existing references below work.
set -g @thm_bg        "#24273a"
set -g @thm_fg        "#cad3f5"
set -g @thm_rosewater "#f4dbd6"
set -g @thm_flamingo  "#f0c6c6"
set -g @thm_pink      "#f5bde6"
set -g @thm_mauve     "#c6a0f6"
set -g @thm_red       "#ed8796"
set -g @thm_maroon    "#ee99a0"
set -g @thm_peach     "#f5a97f"
set -g @thm_yellow    "#eed49f"
set -g @thm_green     "#a6da95"
set -g @thm_teal      "#8bd5ca"
set -g @thm_sky       "#91d7e3"
set -g @thm_sapphire  "#7dc4e4"
set -g @thm_blue      "#8aadf4"
set -g @thm_lavender  "#b7bdf8"
set -g @thm_subtext_1 "#a5adcb"
set -g @thm_subtext_0 "#b8c0e0"
set -g @thm_overlay_2 "#939ab7"
set -g @thm_overlay_1 "#8087a2"
set -g @thm_overlay_0 "#6e738d"
set -g @thm_surface_2 "#5b6078"
set -g @thm_surface_1 "#494d64"
set -g @thm_surface_0 "#363a4f"
set -g @thm_mantle    "#1e2030"
set -g @thm_crust     "#181926"

# Status module glyphs (Nerd Font): rounded cap, then icon + one space.
set -g @thm_status_cap ""
set -g @thm_status_gap " "
set -g @thm_app_icon " "
set -g @thm_session_icon " "

# tmux 3.8's own built-in theme: the chrome tmux draws itself, and what tmux
# reports to panes. The terminal is always dark, so don't autodetect.
set -s theme dark

# Status line: transparent, so the terminal background/blur shows through.
set -g status-style "default"
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100

# Status modules: cap, icon chip on the accent colour, text on the terminal
# background. application = current pane command; session = #S, green normally
# and red while the prefix key is held.
set -g status-right "#[fg=#{@thm_maroon}]#{@thm_status_cap}#[fg=#{@thm_crust},bg=#{@thm_maroon}]#{@thm_app_icon}#[fg=#{@thm_fg},bg=default] #{pane_current_command}#[fg=default]#{@thm_status_gap}"
set -ag status-right "#[fg=#{?client_prefix,#{@thm_red},#{@thm_green}}]#{@thm_status_cap}#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_green}}]#{@thm_session_icon}#[fg=#{@thm_fg},bg=default] #S#[fg=default]#{@thm_status_gap}"

# Window tabs. Do NOT use -F here: it expands the value once when the config
# is sourced, and #I/#W are themselves format sequences, so they would be
# baked to whatever window is current at load time (or to nothing on a fresh
# server). These must stay as formats evaluated when the bar is drawn.
set -g window-status-format "#[fg=#{@thm_crust},bg=#{@thm_overlay_2}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #W "
set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #I #[fg=#{@thm_fg},bg=#{@thm_surface_1}] #W "
set -gF window-status-activity-style "bg=#{@thm_lavender},fg=#{@thm_crust}"
set -gF window-status-bell-style "bg=#{@thm_yellow},fg=#{@thm_crust}"

# Panes, modes, popups
set -gF pane-border-style "fg=#{@thm_overlay_0}"
# `##{` survives the -F pass and becomes a literal `#{` in the stored value, so the
# condition is still evaluated when the border is drawn (same as before).
set -gF pane-active-border-style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -gF mode-style "bg=#{@thm_surface_0},bold"
set -gF clock-mode-colour "#{@thm_blue}"
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "fg=#{@thm_surface_1}"
set -gF menu-selected-style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# session
set -g @continuum-restore 'on'

# visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# keymaps
unbind C-b
set -g prefix C-Space
bind | split-window -h
bind \\ split-window -v

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf
# capture panel content to nvim
bind-key v split-window -h "tmux capture-pane -pt! -S -100000 | nvim -"

# ==================== PLUGIN INITIALIZATION ====================
run '~/.tmux/plugins/tpm/tpm'

# ==================== PLUGIN-SPECIFIC CONFIGS ====================
# Must come after TPM initialization
# tmux 3.8 highlights the whole line in choose-tree with tree-mode-selection-style
# (default: mode-style, which is a solid surface_0 block).
# Keep the selection transparent and just tint the text.
set -gF tree-mode-selection-style "fg=#{@thm_mauve},bg=default,bold"
# tmux 3.8 fills the choose-tree preview border with themedarkgrey
# (tree-mode-border-style bg=themedarkgrey). Drop the fill, keep a thin line.
set -gF tree-mode-border-style "fg=#{@thm_overlay_0}"
# tmux 3.8's default underlines the active window tab; it is already coloured
# above, so drop the attribute.
set -g window-status-current-style "none"
# tmux 3.7 draws the command prompt as an overlay on the status line instead
# of replacing it (tmux issue 5328). The prompt is centred by default, putting
# it on top of the window tabs; `fill` would cover the bar with a solid block.
# Aligning left keeps the prompt transparent and confines it to the left edge,
# where it only grazes the front of the first window tab.
set -gF message-style "fg=#{@thm_teal},bg=default,align=left"
set -gF message-command-style "fg=#{@thm_teal},bg=default,align=left"
